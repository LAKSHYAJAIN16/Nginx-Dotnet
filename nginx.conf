worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # Protected API route
        location /api/ {
            # 1. Trigger internal auth subrequest to /auth-check
            auth_request /auth-check;

            # 2. Extract headers returned by the C# AuthService subrequest
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            # 3. Forward extracted headers to the downstream BackendService
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-User-Role $user_role;

            # Pass request to downstream backend
            proxy_pass http://127.0.0.1:5002/;
        }

        # Subrequest endpoint for C# AuthService validation
        location = /auth-check {
            internal; # Block direct client access

            proxy_pass http://127.0.0.1:5001/validate;

            # Optimize subrequest payload size
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # Pass client headers to C# auth service
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}
